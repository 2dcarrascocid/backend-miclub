crearClub:
  handler: routes/clubes/clubes.crear
  events:
    - httpApi:
        path: /clubes
        method: post

listarClubes:
  handler: routes/clubes/clubes.listar
  events:
    - httpApi:
        path: /clubes
        method: get

editarClub:
  handler: routes/clubes/clubes.editar
  events:
    - httpApi:
        path: /clubes/{clubId}
        method: put
