registerBasic:
  handler: routes/login/loginBasic.register
  events:
    - httpApi:
        path: /auth/register
        method: post

loginBasic:
  handler: routes/login/loginBasic.login
  events:
    - httpApi:
        path: /auth/login
        method: post

loginGoogle:
  handler: routes/login/loginGoogle.login
  events:
    - httpApi:
        path: /auth/google
        method: post

logout:
  handler: routes/login/loginBasic.logout
  events:
    - httpApi:
        path: /auth/logout
        method: post

getProfile:
  handler: routes/login/loginBasic.getProfile
  events:
    - httpApi:
        path: /auth/profile
        method: get

updateProfile:
  handler: routes/login/loginBasic.updateProfile
  events:
    - httpApi:
        path: /auth/profile
        method: put
