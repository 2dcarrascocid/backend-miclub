crearJugador:
  handler: routes/jugadores/jugadores.crear
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores
        method: post

listarJugadores:
  handler: routes/jugadores/jugadores.listar
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores
        method: get

buscarJugadores:
  handler: routes/jugadores/jugadores.buscarJugadores
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores/buscar
        method: get

actualizarJugador:
  handler: routes/jugadores/jugadores.actualizar
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores/{id}
        method: put

descargarPlantillaJugadores:
  handler: routes/jugadores/carga_masiva.descargarPlantilla
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores/plantilla
        method: get

cargaMasivaJugadores:
  handler: routes/jugadores/carga_masiva.procesarCargaMasiva
  timeout: 29
  events:
    - httpApi:
        path: /clubes/{clubId}/jugadores/carga-masiva
        method: post
