service: backend-sls
frameworkVersion: '>=4.0.0'

provider:
  name: aws
  runtime: nodejs22.x          # alineado con engines.node >=22 en package.json
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512              # reducido de default 1024 MB
  timeout: 29                  # máximo para HTTP API Gateway
  environment:
    USE_DB_MOCK: ${env:USE_DB_MOCK}
    API_KEY: ${env:API_KEY}
    SUPABASE_URL_LIGA: ${env:SUPABASE_URL_LIGA}
    SUPABASE_SERVICE_ROLE_KEY_LIGA: ${env:SUPABASE_SERVICE_ROLE_KEY_LIGA}
    SMTP_HOST: ${env:SMTP_HOST}
    SMTP_PORT: ${env:SMTP_PORT}
    SMTP_USER: ${env:SMTP_USER}
    SMTP_PASS: ${env:SMTP_PASS}
    SMTP_SECURE: ${env:SMTP_SECURE}
    SMTP_FROM: ${env:SMTP_FROM}
    FRONTEND_URL: ${self:custom.frontendUrl.${self:provider.stage}, env:FRONTEND_URL}
    MOCK_EMAIL: ${env:MOCK_EMAIL}
    WEBPAY_HOST: ${env:WEBPAY_HOST}
    WEBPAY_API_KEY: ${env:WEBPAY_API_KEY}
    WEBPAY_COMMERCE_CODE: ${env:WEBPAY_COMMERCE_CODE}

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - '*'
      allowedMethods:
        - '*'
      allowCredentials: false

# ─── Lambda única — consolida las 49 funciones anteriores ──────────────────────
functions:
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: GET
      - httpApi:
          path: /{proxy+}
          method: POST
      - httpApi:
          path: /{proxy+}
          method: PUT
      - httpApi:
          path: /{proxy+}
          method: DELETE
      - httpApi:
          path: /{proxy+}
          method: PATCH

plugins:
  - serverless-offline

# ─── Empaquetado: un solo bundle esbuild para toda la app ──────────────────────
package:
  individually: false

build:
  esbuild:
    bundle: true               # incluye todas las dependencias en el bundle
    minify: true               # reduce tamaño del bundle
    target: node22
    platform: node
    sourcemap: false           # no incluir source maps en producción
    external:
      - aws-sdk                # disponible en el runtime de Lambda, no bundlear
    banner:
      js: "import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

custom:
  frontendUrl:
    dev: http://localhost:5173
    prod: https://miclub.fairplay-chile.cl
  serverless-offline:
    disableCookieValidation: true
    noPrependStage: true
